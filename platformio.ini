; =====================================================================
; PlatformIO Configuration for AegisHelm Embedded Hardware
; Run both Arduino sketches directly in VS Code without Arduino IDE
; =====================================================================

[platformio]
default_envs = bike_receiver

; ---------------------------------------------------------------------
; 1. BIKE RECEIVER (Relay + Buzzer + 433MHz RX + Telemetry USB Serial)
; ---------------------------------------------------------------------
[env:bike_receiver]
platform = atmelavr
board = uno
framework = arduino
src_dir = arduino/Receiver
lib_deps =
    mikem/RadioHead@^1.120
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    Wire
monitor_speed = 9600

; ---------------------------------------------------------------------
; 2. HELMET TRANSMITTER (IR Sensors + MQ-3 + MPU-6050 + 433MHz TX)
; ---------------------------------------------------------------------
[env:helmet_transmitter]
platform = atmelavr
board = uno
framework = arduino
src_dir = arduino/helmet_transmitter
lib_deps =
    mikem/RadioHead@^1.120
    Wire
monitor_speed = 9600
